    <div class="mfoot"><span id="mq">New here?</span> <span class="sw" id="msw">Create account</span></div>
  </div>
</div>

<script>
var mode = 'login';
function $(id){return document.getElementById(id)}
function api(url, body){
  var o = body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {};
  return fetch(url,o).then(function(r){return r.json().then(function(j){return {ok:r.ok,data:j}})});
}

function setMode(m){
  mode = m;
  $('mtitle').textContent = m==='login' ? 'Login' : 'Create account';
  $('mgo').textContent = m==='login' ? 'Login' : 'Sign up';
  $('mq').textContent = m==='login' ? 'New here?' : 'Already have an account?';
  $('msw').textContent = m==='login' ? 'Create account' : 'Login';
  $('merr').textContent = '';
}
function openModal(m){ setMode(m); $('modal').classList.add('show'); $('u').focus(); }
function closeModal(){ $('modal').classList.remove('show'); }

function showUser(user, admin){
  var inn = !!user;
  $('btnLogin').style.display = inn ? 'none' : '';
  $('btnSignup').style.display = inn ? 'none' : '';
  $('btnOut').style.display = inn ? '' : 'none';
  $('adminLink').style.display = (inn && admin) ? '' : 'none';
  $('who').textContent = inn ? 'Hi, ' + user.username : '';
  if(inn && !$('cname').value) $('cname').value = user.username;
}

$('btnLogin').onclick = function(){ openModal('login'); };
$('btnSignup').onclick = function(){ openModal('signup'); };
$('mclose').onclick = closeModal;
$('modal').onclick = function(e){ if(e.target === this) closeModal(); };
$('msw').onclick = function(){ setMode(mode==='login'?'signup':'login'); };

$('mgo').onclick = function(){
  var u = $('u').value.trim(), p = $('p').value;
  if(!u || !p){ $('merr').textContent = 'Enter username and password'; return; }
  api(mode==='login' ? '/api/login' : '/api/signup', {username:u,password:p}).then(function(r){
    if(r.ok){ $('p').value=''; closeModal(); showUser(r.data.user, r.data.admin); }
    else { $('merr').textContent = r.data.error || 'Something went wrong'; }
  }).catch(function(){ $('merr').textContent = 'Network error, try again'; });
};
$('p').onkeydown = function(e){ if(e.key==='Enter') $('mgo').click(); };

$('btnOut').onclick = function(){ api('/api/logout',{}).then(function(){ showUser(null,false); }); };

$('csend').onclick = function(){
  var name = $('cname').value.trim(), msg = $('cmsg').value.trim();
  var st = $('cstatus');
  st.className = 'status';
  if(!name){ st.className='status bad'; st.textContent='Please enter your name'; return; }
  if(!msg){ st.className='status bad'; st.textContent='Please write a message'; return; }
  $('csend').disabled = true;
  api('/api/contact', {name:name, message:msg}).then(function(r){
    $('csend').disabled = false;
    if(r.ok){ st.className='status ok'; st.textContent='Message sent. Thank you!'; $('cmsg').value=''; }
    else { st.className='status bad'; st.textContent = r.data.error || 'Could not send'; }
  }).catch(function(){ $('csend').disabled=false; st.className='status bad'; st.textContent='Network error, try again'; });
};

api('/api/me').then(function(r){ showUser(r.data.user, r.data.admin); }).catch(function(){});
</script>
