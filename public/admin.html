<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin - Messages</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:16px;background:#f8f9fa;color:#202124}
.wrap{max-width:600px;margin:0 auto}
h1{font-size:22px}
a{color:#1a73e8}
.m{background:#fff;border:1px solid #dadce0;border-radius:12px;padding:12px 14px;margin-top:10px;word-wrap:break-word;white-space:pre-wrap}
.m b{color:#1a73e8}
.m small{display:block;color:#5f6368;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <a href="/">&larr; Home</a>
  <h1>Visitor messages</h1>
  <div id="list">Loading...</div>
</div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
fetch('/api/admin/messages').then(function(r){return r.json().then(function(j){return {ok:r.ok,data:j}})}).then(function(r){
  var el = document.getElementById('list');
  if(!r.ok){ el.innerHTML = 'Admin login required. <a href="/">Go to Home and Login</a>'; return; }
  var ms = r.data.messages || [];
  el.innerHTML = ms.length ? ms.map(function(m){
    return '<div class="m"><b>'+esc(m.name)+'</b><div>'+esc(m.message)+'</div><small>'+new Date(m.created_at).toLocaleString()+'</small></div>';
  }).join('') : 'No messages yet.';
}).catch(function(){ document.getElementById('list').textContent = 'Error loading'; });
</script>
</body>
</html>
